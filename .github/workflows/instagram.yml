name: Instagram

on:
  schedule:
    # Segunda, quarta e sexta às 09:00 (America/Bahia, UTC-3)
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no Instagram agora
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Gerar post
        run: npm run instagram:generate

      - name: Salvar post gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/instagram
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "chore(instagram): post de $(date +%F)"
            git push
          fi

      - name: Publicar no Instagram
        if: github.event_name == 'schedule' || inputs.publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run instagram:publish
