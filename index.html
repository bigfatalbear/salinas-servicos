    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Salinas Serviços",
        "url": "https://bigfatalbear.github.io/salinas-servicos/",
        "description": "Guia de profissionais, serviços e comércios de Salinas da Margarida, Bahia.",
        "inLanguage": "pt-BR",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://bigfatalbear.github.io/salinas-servicos/profissionais?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      ;(function () {
        try {
          var key = 'ss:theme'
          var mode = localStorage.getItem(key)
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script>
      ;(function () {
        try {
          var base = '%BASE_URL%'
          var resetPath = base + 'redefinir-senha'
          var search = window.location.search
          var hash = window.location.hash
          var isRecovery = /[?&#]type=recovery(?:&|$)/.test(search + hash)
          if (isRecovery && window.location.pathname !== resetPath) {
            window.location.replace(resetPath + search + hash)
          }
        } catch (error) {}
      })()
    </script>
